# GitHub Actions：在 Windows 上构建 send2perclip（C++ / CMake）
#
# 触发：
#   push 到 main            -> 构建 + 上传 artifact
#   push tag v*（如 v1.0.0） -> 构建 + 上传 artifact + 创建/更新 Release 并附上 exe
#   pull request / 手动      -> 只构建 + 上传 artifact
#
# 构建线：MSYS2 UCRT64 里的 MinGW-w64 GCC + Ninja，
# 会走 CMakeLists.txt 非 MSVC 分支的 -static -static-libgcc -static-libstdc++，
# 产出静态链接、可直接拷到别的 Windows 机器上运行的 send2perclip.exe。
#
# 构建后会检查导入表，确认没有 libstdc++-6.dll / libgcc_s_*.dll / libwinpthread-1.dll
# 之类的非系统依赖，防止哪天误改了 CMakeLists.txt 里的静态链接选项而 CI 仍然"绿"。
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支/PR 连续推送时取消上一个未完成的运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------- Windows x64（MinGW-w64 GCC）
  build-windows:
    name: MinGW-w64 GCC x64 (MSYS2 UCRT64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2 (UCRT64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # gcc 自带 windres，用于编译 app.rc 里的 exe 图标
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # CMakeLists.txt 非 MSVC 分支会加 -static -static-libgcc -static-libstdc++
      - name: Configure & build (Release)
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw

      - name: Check static linkage (no libstdc++ / libgcc / winpthread)
        shell: msys2 {0}
        run: |
          objdump -p build-mingw/send2perclip.exe | grep 'DLL Name'

          if objdump -p build-mingw/send2perclip.exe |
               grep -E 'DLL Name: (libstdc\+\+|libgcc|libwinpthread)'; then
            echo "::error::存在非静态运行库依赖"
            exit 1
          fi
          echo "OK：只依赖 Windows 系统 DLL。"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: send2perclip-windows-x64
          path: build-mingw/send2perclip.exe
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------- Release
  release:
    name: Attach binaries to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      # gh 已预装在 runner 上，actions/checkout 不是必需的
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
